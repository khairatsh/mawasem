<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم الخاصة - مواسم</title>
    <!-- كود الحماية المبدئي -->
    <script>
        const adminToken = localStorage.getItem('mawasem_token');
        if (!adminToken) {
            window.location.replace("index.html");
        }
    </script>
    <style>
        /* التعديل الأهم: إخفاء جسم الصفحة بالكامل افتراضياً حتى نتأكد من الهوية */
        body { display: none; background-color: #f4f6f9; font-family: Tahoma, sans-serif; padding: 20px; direction: rtl; }
        .admin-container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2, h3 { color: #333; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { background: #ff9800; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 1em; }
        button:hover { background: #e68a00; }
        .section-box { margin-bottom: 30px; background: #fafafa; padding: 20px; border-radius: 8px; border: 1px solid #eee; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2>🛠️ لوحة التحكم الخاصة</h2>

        <!-- 1. إدارة رسوم التوصيل -->
        <div class="section-box">
            <h3>إدارة رسوم التوصيل</h3>
            <div class="form-group">
                <label>قيمة التوصيل (اكتب "مجاني" أو رقم السعر مثل 30):</label>
                <input type="text" id="deliveryInput" placeholder="مجاني أو 30">
            </div>
            <button onclick="updateDelivery()">حفظ رسوم التوصيل</button>
        </div>

        
        <!-- 2. تصدير بيانات العملاء -->
        <div class="section-box">
            <h3>حملات التسويق والعملاء</h3>
            <p>سحب قائمة بجميع العملاء المسجلين (الأسماء وأرقام الهواتف) في ملف إكسل.</p>
            <button onclick="exportUsers()" style="background: #27ae60;">تحميل قاعدة بيانات العملاء (Excel)</button>
        </div>
    </div>

    <script>
        const API_BASE = 'https://mawasem-test.onrender.com/api';

        // تشغيل هذا الكود فور تحميل الصفحة للتحقق من هوية المدير
        document.addEventListener("DOMContentLoaded", async () => {
            // استخدام الاسم الصحيح للتوكن
            const token = localStorage.getItem("mawasem_token"); 
            
            if (!token) {
                window.location.replace("index.html"); 
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/admin/verify`, {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    // إذا لم يكن مديراً، يتم طرده فوراً ولن تظهر له الصفحة
                    window.location.replace("index.html");
                } else {
                    // إذا أثبت أنه مدير، نقوم بإظهار محتوى الصفحة
                    document.body.style.display = 'block';
                    loadSettings(); // جلب إعدادات التوصيل
                }
            } catch (error) {
                console.error("خطأ في التحقق من الصلاحيات:", error);
                window.location.replace("index.html");
            }
        });

        async function loadSettings() {
            try {
                const res = await fetch(`${API_BASE}/settings/delivery`);
                const data = await res.json();
                if (data.delivery_fee) {
                    document.getElementById('deliveryInput').value = data.delivery_fee;
                }
            } catch (e) { 
                console.error(e); 
            }
        }

        async function updateDelivery() {
            const newFee = document.getElementById('deliveryInput').value;
            const currentToken = localStorage.getItem('mawasem_token'); 

            try {
                const res = await fetch(`${API_BASE}/admin/settings/delivery?new_fee=${encodeURIComponent(newFee)}`, {
                    method: 'POST', 
                    headers: {
                        'Authorization': `Bearer ${currentToken}`
                    }
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    alert('تم تحديث رسوم التوصيل بنجاح!');
                } else {
                    alert('خطأ: ' + (data.detail || 'غير مصرح لك')); 
                    window.location.replace("index.html");
                }
            } catch (e) {
                console.error(e);
                alert('حدث خطأ في الاتصال بالخادم.');
            }
        }

        // التعديل الجذري على دالة التصدير لتمرير الحماية الأمنية بشكل صحيح
        async function exportUsers() {
            const token = localStorage.getItem('mawasem_token');
            
            try {
                const response = await fetch(`${API_BASE}/admin/export-users`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}` // إرسال التوكن إجبارياً هنا
                    }
                });

                if (response.ok) {
                    // تحويل البيانات القادمة إلى ملف وحفظه في جهاز المستخدم
                    const blob = await response.blob();
                    const downloadUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = "mawasem_customers.csv";
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    window.URL.revokeObjectURL(downloadUrl);
                } else {
                    alert('خطأ: غير مصرح لك بتحميل البيانات!');
                    window.location.replace("index.html");
                }
            } catch (e) {
                alert('حدث خطأ في الاتصال بالخادم.');
            }
        }
    </script>
</body>
</html>
