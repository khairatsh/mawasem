<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم الخاصة - مواسم</title>
    <!-- كود الحماية: ينفذ أولاً قبل تحميل الصفحة -->
    <script>
        const adminToken = localStorage.getItem('mawasem_token');
        // إذا لم يكن هناك توكن، أطرد المستخدم فوراً للرئيسية
        if (!adminToken) {
            window.location.replace("index.html");
        }
    </script>
    <style>
        body { background-color: #f4f6f9; font-family: Tahoma, sans-serif; padding: 20px; direction: rtl; }
        .admin-container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2, h3 { color: #333; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { background: #ff9800; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 1em; }
        button:hover { background: #e68a00; }
        .section-box { margin-bottom: 30px; background: #fafafa; padding: 20px; border-radius: 8px; border: 1px solid #eee; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2>🛠️ لوحة التحكم الخاصة</h2>

        <!-- 1. إدارة رسوم التوصيل -->
        <div class="section-box">
            <h3>إدارة رسوم التوصيل</h3>
            <div class="form-group">
                <label>قيمة التوصيل (اكتب "مجاني" أو رقم السعر مثل 30):</label>
                <input type="text" id="deliveryInput" placeholder="مجاني أو 30">
            </div>
            <button onclick="updateDelivery()">حفظ رسوم التوصيل</button>
        </div>

        
        <!-- 2. تصدير بيانات العملاء -->
        <div class="section-box">
            <h3>حملات التسويق والعملاء</h3>
            <p>سحب قائمة بجميع العملاء المسجلين (الأسماء وأرقام الهواتف) في ملف إكسل.</p>
            <button onclick="exportUsers()" style="background: #27ae60;">تحميل قاعدة بيانات العملاء (Excel)</button>
        </div>
    </div>

    <script>

        // تشغيل هذا الكود فور تحميل الصفحة
        document.addEventListener("DOMContentLoaded", async () => {
            // 1. نجلب التوكن من المتصفح
            const token = localStorage.getItem("token"); // تأكد أن اسم التوكن يطابق ما تستخدمه في login
            
            // 2. إذا لم يكن مسجلاً للدخول أصلاً، اطرده للرئيسية
            if (!token) {
                window.location.href = "index.html"; 
                return;
            }

            // 3. التحقق مما إذا كان مديراً عبر الاتصال بالخادم
            try {
                const response = await fetch("https://mawasem-test.onrender.com/api/admin/verify", {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                });

                // إذا رد الخادم بخطأ 403 أو 401 (غير مصرح)، اطرده للرئيسية فوراً
                if (!response.ok) {
                    window.location.href = "index.html";
                }
                // إذا كان مديراً، سيكمل المتصفح عرض الصفحة بشكل طبيعي
            } catch (error) {
                console.error("خطأ في التحقق من الصلاحيات:", error);
                window.location.href = "index.html";
            }
        });
                // رابط الخادم الحي (Render)
        const API_BASE = 'https://mawasem-test.onrender.com/api';

        // دالة جلب إعدادات التوصيل عند فتح الصفحة
        async function loadSettings() {
            try {
                const res = await fetch(`${API_BASE}/settings/delivery`);
                const data = await res.json();
                if (data.delivery_fee) {
                    document.getElementById('deliveryInput').value = data.delivery_fee;
                }
            } catch (e) { 
                console.error(e); 
            }
        }

        // الدالة المحمية لتحديث التوصيل
        async function updateDelivery() {
            const newFee = document.getElementById('deliveryInput').value;
            // يمكننا استدعاء التوكن مباشرة من الـ localStorage هنا بدون تعريفه كـ const لكي لا يتعارض
            const currentToken = localStorage.getItem('mawasem_token'); 

            try {
                const res = await fetch(`${API_BASE}/admin/settings/delivery?new_fee=${encodeURIComponent(newFee)}`, {
                    method: 'POST', 
                    headers: {
                        'Authorization': `Bearer ${currentToken}` // إرسال المفتاح السري للخادم
                    }
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    alert('تم تحديث رسوم التوصيل بنجاح!');
                } else {
                    alert('خطأ: ' + (data.detail || 'غير مصرح لك')); 
                }
            } catch (e) {
                console.error(e);
                alert('حدث خطأ في الاتصال بالخادم.');
            }
        }

        // دالة تصدير المستخدمين
        function exportUsers() {
            // نمرر التوكن في الرابط أو نفتح نافذة جديدة مع مصادقة (لتبسيطها الآن نتركها كما هي ونحميها لاحقاً إذا أردت)
            window.open(`${API_BASE}/admin/export-users`, '_blank');
        }

        // تشغيل دالة جلب الإعدادات بمجرد تحميل الصفحة
        document.addEventListener('DOMContentLoaded', loadSettings);
    </script>
</body>
</html>
