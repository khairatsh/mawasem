<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">مواسم - القسم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="top-bar">
        <span id="offer-text" style="transition: opacity 0.5s ease-in-out;">توصيل مجاني للطلبات فوق 200 ريال</span>
    </div>

    <header>
        <div class="header-container">
            <button class="mobile-menu-btn" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
            <div class="logo">
                <h1>مواسم</h1>
                <span>Mawasem</span>
            </div>
            <div class="search-bar">
                <input type="text" placeholder="ابحث عن منتجك المفضل...">
                <button><i class="fa-solid fa-search"></i></button>
            </div>
            <div class="header-icons">
                <a href="login.html" id="authLink" class="store-icon" title="تسجيل الدخول">
                    <i class="fa-solid fa-user"></i>
                    <span id="authText" class="icon-text">دخول</span>
                </a>
                <a href="cart.html" class="store-icon cart-icon" title="سلة المشتريات">
                    <div class="cart-badge-wrapper">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <span id="navCartCount" class="cart-badge" style="display: none;">0</span>
                    </div>
                    <span class="icon-text">السلة</span>
                </a>
                <a href="https://wa.me/+201023350404" target="_blank" class="store-icon whatsapp-support" title="تواصل معنا">
                    <i class="fa-brands fa-whatsapp"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- شريط التنقل -->
    <nav class="seasons-nav">
        <div class="nav-container">
            <a href="index.html" class="active"><i class="fa-solid fa-house"></i> الرئيسية</a>
            <a href="category.html?type=summer"><i class="fa-solid fa-sun"></i> الصيف</a>
            <a href="category.html?type=school"><i class="fa-solid fa-school"></i> عودة المدارس</a>
            <a href="category.html?type=winter"><i class="fa-solid fa-snowflake"></i> الشتاء</a>
            <a href="category.html?type=wedding"><i class="fa-solid fa-ring"></i> الزواج</a>
            <a href="category.html?type=babies"><i class="fa-solid fa-baby"></i> البيبيهات</a>
        </div>
    </nav>

    <main class="products-section" style="margin-top: 40px;">
        <div class="section-header">
            <h2 id="categoryNameHeading">جاري التحميل...</h2>
        </div>
        
        <div class="filter-bar">
            <label><i class="fa-solid fa-arrow-down-short-wide"></i> ترتيب:</label>
            <select onchange="sortProducts(this.value, 'dynamic-category-container')">
                <option value="default">الافتراضي</option>
                <option value="price-low">السعر: من الأقل إلى الأعلى</option>
                <option value="price-high">السعر: من الأعلى إلى الأقل</option>
            </select>
        </div>

        <div id="dynamic-category-container" class="products-grid"></div>
    </main>

    <!-- 1. استدعاء ملفات بيانات المنتجات أولاً -->
    <script src="js/categories/summer.js"></script>
    <script src="js/categories/school.js"></script>
    <script src="js/categories/winter.js"></script>
    <script src="js/categories/wedding.js"></script>
    <script src="js/categories/babies.js"></script>

    <!-- 2. استدعاء الدالة الأساسية للمتجر (مهمة جداً لأنها تحتوي على renderProducts) -->
    <script src="js/main.js"></script>

    <!-- 3. استدعاء ملف الأقسام الذي أنشأناه للتو -->
    <script src="js/category.js"></script>
</body>
